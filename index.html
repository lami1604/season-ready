<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#101820" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="styles.css" />
<title>Season Ready</title>
</head>
<body>
<header class="topbar">
  <div>
    <p class="eyebrow">Season Ready</p>
    <h1 id="todayTitle">Today</h1>
  </div>
  <button id="resetBtn" class="ghost">Reset</button>
</header>
<main>
<section class="hero card">
  <div>
    <p class="eyebrow">Target</p>
    <h2>15st 10lb → 14st</h2>
    <p id="countdown">Pre-season countdown loading...</p>
  </div>
  <div class="score"><span id="fitnessScore">50</span><small>fitness score</small></div>
</section>
<nav class="tabs">
  <button class="tab active" data-view="today">Today</button>
  <button class="tab" data-view="plan">Plan</button>
  <button class="tab" data-view="log">Log</button>
  <button class="tab" data-view="progress">Progress</button>
</nav>
<section id="today" class="view active"></section>
<section id="plan" class="view"></section>
<section id="log" class="view"></section>
<section id="progress" class="view"></section>
</main>
<script src="app.js"></script>
</body>
</html>
